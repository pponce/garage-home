name: Manual app
on:
  push:
    branches: [feat/manual-app-mode, feat/vetro-controls, compat/stock-vetro-0.5.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GarageHome-screen-checks
          path: test-results/*
          if-no-files-found: ignore
          retention-days: 14
      - run: python3 tools/build-manual.py
      - uses: actions/upload-artifact@v4
        with:
          name: GarageHome-manual-unsigned
          path: dist/*
          retention-days: 14

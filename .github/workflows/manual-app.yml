name: Manual app
on:
  push:
    branches: [feat/manual-app-mode]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: python3 tools/build-manual.py
      - uses: actions/upload-artifact@v4
        with:
          name: GarageHome-manual-unsigned
          path: dist/*
          retention-days: 14
